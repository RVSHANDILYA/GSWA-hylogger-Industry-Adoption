<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#05080d" />
    <meta
      name="description"
      content="GSWA HyLogger Industry Adoption. Turning open hyperspectral drill core scans from the Geological Survey of Western Australia into a call on every metre of core."
    />

    <!--
      Type pairing. Instrument Serif carries the display sizes, IBM Plex Sans
      does the reading, IBM Plex Mono holds every number so depths and
      percentages line up in a column. Loaded here rather than imported from
      CSS so the browser starts fetching them before the bundle parses.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap"
    />

    <title>GSWA HyLogger Industry Adoption</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

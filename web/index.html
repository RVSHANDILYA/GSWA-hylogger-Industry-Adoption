    <!--
      Type pairing. Source Serif 4 carries the display sizes, IBM Plex Sans
      does the reading, IBM Plex Mono holds every number so depths and
      percentages line up in a column. Loaded here rather than imported from
      CSS so the browser starts fetching them before the bundle parses.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:ital,wght@0,400;0,500;1,400&display=swap"
    />
